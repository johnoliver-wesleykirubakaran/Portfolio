<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>John Oliver | Portfolio</title>
    <meta
      name="description"
      content="B.Tech CS student building practical AI and ML systems."
    />
    <meta name="author" content="John Oliver" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Let the browser know the site supports both themes natively. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="John Oliver | Portfolio" />
    <meta
      property="og:description"
      content="B.Tech CS student building practical AI and ML systems."
    />

    <!-- Fonts: preconnect first so the CSS request starts on an open socket. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
    />

    <!--
      Progressive enhancement: if scripting is unavailable the reveal hook never
      runs, so make every section visible immediately instead of opacity: 0.
    -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
